name: Expirar reservas pendientes

# El plan gratuito (Hobby) de Vercel solo permite cron jobs una vez al día,
# así que este workflow llama al endpoint cada 5 minutos como mecanismo
# principal. No afecta la regla de "cero sobreventa" (la disponibilidad ya
# excluye reservas PENDING_PAYMENT vencidas en la propia consulta), pero
# mantiene su estado (EXPIRED) al día para el panel de administración.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  expire:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar al endpoint de expiración
        run: |
          curl -sf -X POST "${{ secrets.APP_BASE_URL }}/api/cron/expire-reservations" \
            -H "x-cron-secret: ${{ secrets.CRON_SECRET }}"
